spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:danceylone
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

  flyway:
    enabled: false

  jwt:
    secret: ${JWT_SECRET}
    expiration-millis: 3600000

# OpenAPI/Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

application:
  version: 1.0.0

#    Why these settings?
#    •	mem:danceylone → in-memory DB
#    •	flyway disabled → no migrations yet
#    •	ddl-auto: update → schema auto-update at startup
#    •	Keeps startup clean and predictable
#    •	Swagger UI at /swagger-ui.html → interactive API docs