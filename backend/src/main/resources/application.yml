spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  jpa:
    open-in-view: false  # Best practice for performance

jwt:
  # Development secret (512-bit base64). Change in production via JWT_SECRET env var!
  secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RUb2tlbkVuY3J5cHRpb25BbmRTaG91bGRCZUNoYW5nZWRJblByb2R1Y3Rpb249}
  expiration-millis: 3600000  # 1 hour

# OpenAPI/Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

application:
  version: 1.0.0

#    Why these settings?
#    •	mem:danceylone → in-memory DB
#    •	flyway disabled → no migrations yet
#    •	ddl-auto: update → schema auto-update at startup
#    •	Keeps startup clean and predictable
#    •	Swagger UI at /swagger-ui.html → interactive API docs